databases:
  - name: vaccine-db
    databaseName: vaccine_surveillance
    user: vaccine_user
    plan: free
    region: oregon

services:
  - type: web
    name: vaccine-app
    runtime: python
    region: oregon
    buildCommand: pip install -r requirements.txt && cd ui && npm install && npm run build
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: vaccine-db
          property: connectionString
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: ANTHROPIC_API_KEY
        sync: false
